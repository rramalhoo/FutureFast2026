<div style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#f4f4f4;padding:32px">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:20px;padding:32px;color:#4f4f4f">
    <div style="font-size:20px;font-weight:600;color:#2f2a33">Genvity</div>
    <h1 style="font-size:22px;color:#2f2a33;margin:24px 0 8px">Redefinição de senha</h1>
    <p style="line-height:1.6">Recebemos um pedido para redefinir a senha da sua conta.</p>
    <p style="margin:28px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
         style="background:#9448bd;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-weight:600;display:inline-block">Criar nova senha</a>
    </p>
    <p style="font-size:13px;color:#6f6f6f;line-height:1.6">Se você não pediu a redefinição, ignore este e-mail — sua senha continua a mesma.</p>
  </div>
</div>
